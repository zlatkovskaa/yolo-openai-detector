[project]
name = "yolo-image-gateway"
version = "0.0.0"
description = "CPU-first YOLO single-image object detection through an OpenAI-compatible API style."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [
  { name = "Project owner" }
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "pillow>=10.4",
  "numpy>=1.26",
  "ultralytics>=8.3"
]

[project.optional-dependencies]
dev = [
  "openai>=1.0",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.coverage.run]
source = ["src/yolo_image_gateway"]
